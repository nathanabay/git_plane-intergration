<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-label="Illustration · Where to configure everyday behavior"><rect width="1200" height="510" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#19334e} .title{font-size:27px;font-weight:bold}.sub{font-size:16px;fill:#49617a}.box{fill:#f0f6ff;stroke:#3676c8;stroke-width:2;rx:12}.label{font-size:19px;font-weight:bold}.small{font-size:16px}.arrow{fill:none;stroke:#3676c8;stroke-width:2.5;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#3676c8"/></marker></defs><text x="40" y="46" class="title">Illustration · Where to configure everyday behavior</text><text x="40" y="78" class="sub">A mapped repository exposes Settings, Conflict policies, Rules and Test rules.</text><rect class="box" x="40" y="130" width="330" height="220"/><text class="label" x="58" y="162">Settings</text><text class="small" x="58" y="195">Choose direction and states</text><text class="small" x="58" y="222">Smart Commits on / off</text><text class="small" x="58" y="249">Link-back comments</text><text class="small" x="58" y="276">Report problems</text><rect class="box" x="435" y="130" width="330" height="220"/><text class="label" x="453" y="162">Conflict policies</text><text class="small" x="453" y="195">Title / description: GitHub wins</text><text class="small" x="453" y="222">State / labels / assignees /</text><text class="small" x="453" y="249">comments: last write wins</text><text class="small" x="453" y="276">Choose per field</text><rect class="box" x="830" y="130" width="330" height="220"/><text class="label" x="848" y="162">Rules → Test rules</text><text class="small" x="848" y="195">Simple lifecycle state table</text><text class="small" x="848" y="222">Advanced ordered YAML rules</text><text class="small" x="848" y="249">First matching rule wins</text><text class="small" x="848" y="276">Preview before saving</text><text class="small" x="40" y="415">Relation reference → links only. Non-closing reference → no merge-state transition.</text><text class="small" x="40" y="455">Closing reference → merge transition eligible once no linked PR is still open.</text></svg>