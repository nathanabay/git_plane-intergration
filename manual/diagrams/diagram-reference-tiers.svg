<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="370" viewBox="0 0 1100 370" role="img" aria-label="One strongest reference per work item"><rect width="1100" height="370" rx="12" fill="#f3f7fa"/><text x="40" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#163c54">One strongest reference per work item</text><text x="40" y="80" font-family="Arial,sans-serif" font-size="18" fill="#516d80">Diagram · Read the branch as well as the PR text</text><rect x="40.0" y="110" width="314.6666666666667" height="74" rx="8" fill="#176585"/><text x="56.0" y="139" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="white">Closing</text><text x="56.0" y="166" font-family="Arial,sans-serif" font-size="17" fill="white">Closes WEB-42 or web-42-*</text><path d="M 361.6666666666667 147 h 20 l -7 -6 m 7 6 l -7 6" stroke="#516d80" stroke-width="3" fill="none"/><rect x="392.6666666666667" y="110" width="314.6666666666667" height="74" rx="8" fill="#df733f"/><text x="408.6666666666667" y="139" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="white">Non-closing</text><text x="408.6666666666667" y="166" font-family="Arial,sans-serif" font-size="17" fill="white">Refs WEB-42</text><path d="M 714.3333333333334 147 h 20 l -7 -6 m 7 6 l -7 6" stroke="#516d80" stroke-width="3" fill="none"/><rect x="745.3333333333334" y="110" width="314.6666666666667" height="74" rx="8" fill="#69599a"/><text x="761.3333333333334" y="139" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="white">Relation</text><text x="761.3333333333334" y="166" font-family="Arial,sans-serif" font-size="17" fill="white">Relates to WEB-42</text><rect x="40.0" y="205" width="314.6666666666667" height="74" rx="8" fill="#176585"/><text x="56.0" y="234" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="white">Scan</text><text x="56.0" y="261" font-family="Arial,sans-serif" font-size="17" fill="white">Branch + PR title + body</text><path d="M 361.6666666666667 242 h 20 l -7 -6 m 7 6 l -7 6" stroke="#516d80" stroke-width="3" fill="none"/><rect x="392.6666666666667" y="205" width="314.6666666666667" height="74" rx="8" fill="#df733f"/><text x="408.6666666666667" y="234" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="white">Combine</text><text x="408.6666666666667" y="261" font-family="Arial,sans-serif" font-size="17" fill="white">Keep the strongest tier</text><path d="M 714.3333333333334 242 h 20 l -7 -6 m 7 6 l -7 6" stroke="#516d80" stroke-width="3" fill="none"/><rect x="745.3333333333334" y="205" width="314.6666666666667" height="74" rx="8" fill="#69599a"/><text x="761.3333333333334" y="234" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="white">Apply</text><text x="761.3333333333334" y="261" font-family="Arial,sans-serif" font-size="17" fill="white">Rules and mapping policy</text><text x="40" y="345" font-family="Arial,sans-serif" font-size="17" fill="#38576b">A weaker phrase cannot downgrade a stronger reference. PR parsing does not fetch commit history.</text></svg>