<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="370" viewBox="0 0 1100 370" role="img" aria-label="State names belong to state groups"><rect width="1100" height="370" rx="12" fill="#f3f7fa"/><text x="40" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#163c54">State names belong to state groups</text><text x="40" y="80" font-family="Arial,sans-serif" font-size="18" fill="#516d80">Diagram · Example workflow; project names may differ</text><rect x="40.0" y="110" width="314.6666666666667" height="74" rx="8" fill="#176585"/><text x="56.0" y="139" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="white">Backlog</text><text x="56.0" y="166" font-family="Arial,sans-serif" font-size="17" fill="white">Not scheduled</text><path d="M 361.6666666666667 147 h 20 l -7 -6 m 7 6 l -7 6" stroke="#516d80" stroke-width="3" fill="none"/><rect x="392.6666666666667" y="110" width="314.6666666666667" height="74" rx="8" fill="#df733f"/><text x="408.6666666666667" y="139" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="white">Unstarted</text><text x="408.6666666666667" y="166" font-family="Arial,sans-serif" font-size="17" fill="white">Ready to begin</text><path d="M 714.3333333333334 147 h 20 l -7 -6 m 7 6 l -7 6" stroke="#516d80" stroke-width="3" fill="none"/><rect x="745.3333333333334" y="110" width="314.6666666666667" height="74" rx="8" fill="#69599a"/><text x="761.3333333333334" y="139" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="white">Started</text><text x="761.3333333333334" y="166" font-family="Arial,sans-serif" font-size="17" fill="white">Work is underway</text><rect x="40.0" y="205" width="491.0" height="74" rx="8" fill="#176585"/><text x="56.0" y="234" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="white">Completed</text><text x="56.0" y="261" font-family="Arial,sans-serif" font-size="17" fill="white">Outcome delivered</text><path d="M 538.0 242 h 20 l -7 -6 m 7 6 l -7 6" stroke="#516d80" stroke-width="3" fill="none"/><rect x="569.0" y="205" width="491.0" height="74" rx="8" fill="#df733f"/><text x="585.0" y="234" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="white">Cancelled</text><text x="585.0" y="261" font-family="Arial,sans-serif" font-size="17" fill="white">No longer being pursued</text><text x="40" y="345" font-family="Arial,sans-serif" font-size="17" fill="#38576b">In Progress and In Review can both belong to Started. Group and state name are separate concepts.</text></svg>