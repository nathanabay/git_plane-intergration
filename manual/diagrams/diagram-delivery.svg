<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="370" viewBox="0 0 1100 370" role="img" aria-label="Why the screen can lag behind GitHub"><rect width="1100" height="370" rx="12" fill="#f3f7fa"/><text x="40" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#163c54">Why the screen can lag behind GitHub</text><text x="40" y="80" font-family="Arial,sans-serif" font-size="18" fill="#516d80">Diagram · A durable delivery path</text><rect x="40.0" y="110" width="314.6666666666667" height="74" rx="8" fill="#176585"/><text x="56.0" y="139" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="white">Event</text><text x="56.0" y="166" font-family="Arial,sans-serif" font-size="17" fill="white">A change happens</text><path d="M 361.6666666666667 147 h 20 l -7 -6 m 7 6 l -7 6" stroke="#516d80" stroke-width="3" fill="none"/><rect x="392.6666666666667" y="110" width="314.6666666666667" height="74" rx="8" fill="#df733f"/><text x="408.6666666666667" y="139" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="white">Webhook</text><text x="408.6666666666667" y="166" font-family="Arial,sans-serif" font-size="17" fill="white">A signed delivery arrives</text><path d="M 714.3333333333334 147 h 20 l -7 -6 m 7 6 l -7 6" stroke="#516d80" stroke-width="3" fill="none"/><rect x="745.3333333333334" y="110" width="314.6666666666667" height="74" rx="8" fill="#69599a"/><text x="761.3333333333334" y="139" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="white">Queue</text><text x="761.3333333333334" y="166" font-family="Arial,sans-serif" font-size="17" fill="white">The event waits its turn</text><rect x="40.0" y="205" width="314.6666666666667" height="74" rx="8" fill="#176585"/><text x="56.0" y="234" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="white">Rules</text><text x="56.0" y="261" font-family="Arial,sans-serif" font-size="17" fill="white">Resolve item and policy</text><path d="M 361.6666666666667 242 h 20 l -7 -6 m 7 6 l -7 6" stroke="#516d80" stroke-width="3" fill="none"/><rect x="392.6666666666667" y="205" width="314.6666666666667" height="74" rx="8" fill="#df733f"/><text x="408.6666666666667" y="234" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="white">Write</text><text x="408.6666666666667" y="261" font-family="Arial,sans-serif" font-size="17" fill="white">Apply the permitted update</text><path d="M 714.3333333333334 242 h 20 l -7 -6 m 7 6 l -7 6" stroke="#516d80" stroke-width="3" fill="none"/><rect x="745.3333333333334" y="205" width="314.6666666666667" height="74" rx="8" fill="#69599a"/><text x="761.3333333333334" y="234" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="white">UI</text><text x="761.3333333333334" y="261" font-family="Arial,sans-serif" font-size="17" fill="white">Reload to see the result</text><text x="40" y="345" font-family="Arial,sans-serif" font-size="17" fill="#38576b">Echo suppression recognizes the integration’s own writes so the same change does not bounce forever.</text></svg>