<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-label="Illustration · GitHub App URLs and webhook"><rect width="1200" height="610" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#19334e} .title{font-size:27px;font-weight:bold}.sub{font-size:16px;fill:#49617a}.box{fill:#f0f6ff;stroke:#3676c8;stroke-width:2;rx:12}.label{font-size:19px;font-weight:bold}.small{font-size:16px}.arrow{fill:none;stroke:#3676c8;stroke-width:2.5;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#3676c8"/></marker></defs><text x="40" y="46" class="title">Illustration · GitHub App URLs and webhook</text><text x="40" y="78" class="sub">Use your public Plane origin in all three endpoints. This is a drawing, not a GitHub screenshot.</text><rect class="box" x="40" y="125" width="1120" height="125"/><text class="label" x="58" y="157">General / user authorization</text><text class="small" x="58" y="190">Homepage: https://plane.example.com</text><text class="small" x="58" y="217">Callback: https://plane.example.com/git-sync/oauth/github/callback</text><rect class="box" x="40" y="280" width="1120" height="125"/><text class="label" x="58" y="312">Post installation</text><text class="small" x="58" y="345">Setup: https://plane.example.com/git-sync/install/github/callback</text><text class="small" x="58" y="372">Redirect on update: ON · OAuth during installation: OFF · Device flow: OFF</text><rect class="box" x="40" y="435" width="1120" height="125"/><text class="label" x="58" y="467">Webhook</text><text class="small" x="58" y="500">Active: ON · URL: https://plane.example.com/git-sync/webhooks/github</text><text class="small" x="58" y="527">Secret: generate privately; enter the same value in God mode → Git Sync</text></svg>