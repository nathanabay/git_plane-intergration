<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-label="Illustration · GitHub App permissions and events"><rect width="1200" height="590" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#19334e} .title{font-size:27px;font-weight:bold}.sub{font-size:16px;fill:#49617a}.box{fill:#f0f6ff;stroke:#3676c8;stroke-width:2;rx:12}.label{font-size:19px;font-weight:bold}.small{font-size:16px}.arrow{fill:none;stroke:#3676c8;stroke-width:2.5;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#3676c8"/></marker></defs><text x="40" y="46" class="title">Illustration · GitHub App permissions and events</text><text x="40" y="78" class="sub">Checks and Commit statuses are separate permissions; both are needed.</text><rect class="box" x="40" y="125" width="525" height="330"/><text class="label" x="58" y="157">Permissions</text><text class="small" x="58" y="190">Repository: Pull requests — Read &amp; write</text><text class="small" x="58" y="217">Repository: Issues — Read &amp; write</text><text class="small" x="58" y="244">Repository: Contents — Read &amp; write</text><text class="small" x="58" y="271">Repository: Checks — Read</text><text class="small" x="58" y="298">Repository: Commit statuses — Read</text><text class="small" x="58" y="325">Repository: Deployments — Read</text><text class="small" x="58" y="352">Repository: Metadata — Read</text><text class="small" x="58" y="379">Organization: Members — Read</text><rect class="box" x="630" y="125" width="530" height="330"/><text class="label" x="648" y="157">Subscribe to these nine events</text><text class="small" x="648" y="190">Pull request · Pull request review · Push</text><text class="small" x="648" y="217">Issues · Issue comment</text><text class="small" x="648" y="244">Check suite · Check run · Status</text><text class="small" x="648" y="271">Deployment status</text><text class="small" x="648" y="298"></text><text class="small" x="648" y="325">Installation events arrive automatically.</text><text class="small" x="648" y="352">Administration: write only for autolinks.</text><text class="small" x="648" y="379">Current mapping UI marks autolinks unavailable.</text><text x="40" y="515" class="small">Where installed: owning account only, or any account if you need other organizations.</text><text x="40" y="550" class="small">Existing installations may need owner approval of new permissions.</text></svg>