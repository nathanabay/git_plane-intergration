 -7 -6 m 7 6 l -7 6" stroke="#516d80" stroke-width="3" fill="none"/><rect x="392.6666666666667" y="205" width="314.6666666666667" height="74" rx="8" fill="#df733f"/><text x="408.6666666666667" y="234" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="white">Practice</text><text x="408.6666666666667" y="261" font-family="Arial,sans-serif" font-size="17" fill="white">Branch, commit and PR</text><path d="M 714.3333333333334 242 h 20 l -7 -6 m 7 6 l -7 6" stroke="#516d80" stroke-width="3" fill="none"/><rect x="745.3333333333334" y="205" width="314.6666666666667" height="74" rx="8" fill="#69599a"/><text x="761.3333333333334" y="234" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="white">Verify</text><text x="761.3333333333334" y="261" font-family="Arial,sans-serif" font-size="17" fill="white">Plane reflects the result</text><text x="40" y="345" font-family="Arial,sans-serif" font-size="17" fill="#38576b">A connected account is different from a mapped repository. Ask an administrator about repository setup.</text></svg>