<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-label="A webhook is a doorbell, not the whole job"><rect width="1200" height="610" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#19334e} .title{font-size:27px;font-weight:bold}.sub{font-size:16px;fill:#49617a}.box{fill:#f0f6ff;stroke:#3676c8;stroke-width:2;rx:12}.label{font-size:19px;font-weight:bold}.small{font-size:16px}.arrow{fill:none;stroke:#3676c8;stroke-width:2.5;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#3676c8"/></marker></defs><text x="40" y="46" class="title">A webhook is a doorbell, not the whole job</text><text x="40" y="78" class="sub">Both directions verify the notification first and do the work in background queues.</text><rect class="box" x="40" y="125" width="305" height="135"/><text class="label" x="58" y="157">1 · Plane changed</text><text class="small" x="58" y="190">HMAC signature + delivery ID</text><text class="small" x="58" y="217">Bot changes will be suppressed</text><rect class="box" x="445" y="125" width="305" height="135"/><text class="label" x="463" y="157">2 · Plane ingress</text><text class="small" x="463" y="190">Verify → inbound-plane</text><text class="small" x="463" y="217">Queue unavailable → PG spool</text><rect class="box" x="855" y="125" width="305" height="135"/><text class="label" x="873" y="157">3 · GitHub write</text><text class="small" x="873" y="190">Mirror fields allowed by policy</text><text class="small" x="873" y="217">outbound-github → GitHub API</text><path class="arrow" d="M345 192 L445 192"/><path class="arrow" d="M750 192 L855 192"/><rect class="box" x="40" y="350" width="305" height="135"/><text class="label" x="58" y="382">1 · GitHub changed</text><text class="small" x="58" y="415">Issue, PR, push, CI or deploy</text><text class="small" x="58" y="442">App webhook signature</text><rect class="box" x="445" y="350" width="305" height="135"/><text class="label" x="463" y="382">2 · GitHub ingress</text><text class="small" x="463" y="415">Verify → inbound-github</text><text class="small" x="463" y="442">Reducers resolve mapped scope</text><rect class="box" x="855" y="350" width="305" height="135"/><text class="label" x="873" y="382">3 · Plane write</text><text class="small" x="873" y="415">Rules, links or mirror update</text><text class="small" x="873" y="442">outbound-plane → Plane API</text><path class="arrow" d="M345 418 L445 418"/><path class="arrow" d="M750 418 L855 418"/><text x="40" y="565" class="small">Postgres outbox stores intent before writes. Echo hashes stop writes from bouncing back.</text></svg>