<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="465" viewBox="0 0 1100 465" role="img" aria-label="A work item has several kinds of information"><rect width="1100" height="465" rx="12" fill="#f3f7fa"/><text x="40" y="48" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="#163c54">A work item has several kinds of information</text><text x="40" y="80" font-family="Arial,sans-serif" font-size="18" fill="#516d80">Diagram · Keep outcome, ownership and planning distinct</text><rect x="40.0" y="110" width="491.0" height="74" rx="8" fill="#176585"/><text x="56.0" y="139" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="white">Outcome</text><text x="56.0" y="166" font-family="Arial,sans-serif" font-size="17" fill="white">Title and acceptance criteria</text><path d="M 538.0 147 h 20 l -7 -6 m 7 6 l -7 6" stroke="#516d80" stroke-width="3" fill="none"/><rect x="569.0" y="110" width="491.0" height="74" rx="8" fill="#df733f"/><text x="585.0" y="139" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="white">Ownership</text><text x="585.0" y="166" font-family="Arial,sans-serif" font-size="17" fill="white">Assignees and comments</text><rect x="40.0" y="205" width="491.0" height="74" rx="8" fill="#176585"/><text x="56.0" y="234" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="white">Workflow</text><text x="56.0" y="261" font-family="Arial,sans-serif" font-size="17" fill="white">State and priority</text><path d="M 538.0 242 h 20 l -7 -6 m 7 6 l -7 6" stroke="#516d80" stroke-width="3" fill="none"/><rect x="569.0" y="205" width="491.0" height="74" rx="8" fill="#df733f"/><text x="585.0" y="234" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="white">Planning</text><text x="585.0" y="261" font-family="Arial,sans-serif" font-size="17" fill="white">Dates, cycle and module</text><rect x="40.0" y="300" width="491.0" height="74" rx="8" fill="#176585"/><text x="56.0" y="329" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="white">Relationships</text><text x="56.0" y="356" font-family="Arial,sans-serif" font-size="17" fill="white">Parent, child and blockers</text><path d="M 538.0 337 h 20 l -7 -6 m 7 6 l -7 6" stroke="#516d80" stroke-width="3" fill="none"/><rect x="569.0" y="300" width="491.0" height="74" rx="8" fill="#df733f"/><text x="585.0" y="329" font-family="Arial,sans-serif" font-size="21" font-weight="bold" fill="white">Development</text><text x="585.0" y="356" font-family="Arial,sans-serif" font-size="17" fill="white">Linked branches and PRs</text><text x="40" y="440" font-family="Arial,sans-serif" font-size="17" fill="#38576b">Changing a view changes the presentation. Editing a work item changes the underlying shared record.</text></svg>