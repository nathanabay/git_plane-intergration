<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-label="What the installer actually does"><rect width="1200" height="570" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#19334e} .title{font-size:27px;font-weight:bold}.sub{font-size:16px;fill:#49617a}.box{fill:#f0f6ff;stroke:#3676c8;stroke-width:2;rx:12}.label{font-size:19px;font-weight:bold}.small{font-size:16px}.arrow{fill:none;stroke:#3676c8;stroke-width:2.5;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#3676c8"/></marker></defs><text x="40" y="46" class="title">What the installer actually does</text><text x="40" y="78" class="sub">Host Bash coordinates Docker; TypeScript inside a temporary container writes the integration.</text><rect class="box" x="40" y="125" width="320" height="160"/><text class="label" x="58" y="157">1 · Find and prove Plane</text><text class="small" x="58" y="190">Docker Compose labels / folder</text><text class="small" x="58" y="217">Start stopped Plane if permitted</text><text class="small" x="58" y="244">Compare api + DB config hashes</text><rect class="box" x="440" y="125" width="320" height="160"/><text class="label" x="458" y="157">2 · Prepare images</text><text class="small" x="458" y="190">Build git-sync:local</text><text class="small" x="458" y="217">v1.4.2 UI forks when selected</text><text class="small" x="458" y="244">Stock UI remains an option</text><rect class="box" x="840" y="125" width="320" height="160"/><text class="label" x="858" y="157">3 · Verify answers</text><text class="small" x="858" y="190">Bot PAT → Plane user ID</text><text class="small" x="858" y="217">Check allowed internal hostname</text><text class="small" x="858" y="244">Read webhook secret privately</text><path class="arrow" d="M360 195 L440 195"/><path class="arrow" d="M760 195 L840 195"/><rect class="box" x="40" y="360" width="320" height="160"/><text class="label" x="58" y="392">4 · Configure</text><text class="small" x="58" y="425">Owner-only git-sync.env</text><text class="small" x="58" y="452">Own Postgres role / database</text><text class="small" x="58" y="479">Preserve encryption key on rerun</text><rect class="box" x="440" y="360" width="320" height="160"/><text class="label" x="458" y="392">5 · Merge and route</text><text class="small" x="458" y="425">Back up changed env / override</text><text class="small" x="458" y="452">Keep operator entries and tags</text><text class="small" x="458" y="479">Route /git-sync/* before Plane</text><rect class="box" x="840" y="360" width="320" height="160"/><text class="label" x="858" y="392">6 · Start and explain</text><text class="small" x="858" y="425">Compose up; HTTP health probe</text><text class="small" x="858" y="452">Show next configuration steps</text><text class="small" x="858" y="479">Print full future restart command</text><path class="arrow" d="M1000 285 L1000 330"/><path class="arrow" d="M1000 330 L200 330"/><path class="arrow" d="M200 330 L200 360"/><path class="arrow" d="M360 430 L440 430"/><path class="arrow" d="M760 430 L840 430"/></svg>