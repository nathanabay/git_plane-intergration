<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-label="Two notebooks, one messenger"><rect width="1200" height="610" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#19334e} .title{font-size:27px;font-weight:bold}.sub{font-size:16px;fill:#49617a}.box{fill:#f0f6ff;stroke:#3676c8;stroke-width:2;rx:12}.label{font-size:19px;font-weight:bold}.small{font-size:16px}.arrow{fill:none;stroke:#3676c8;stroke-width:2.5;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#3676c8"/></marker></defs><text x="40" y="46" class="title">Two notebooks, one messenger</text><text x="40" y="78" class="sub">Plane plans the work. GitHub records the code. git-sync connects the selected work.</text><rect class="box" x="40" y="135" width="305" height="175"/><text class="label" x="58" y="167">Plane</text><text class="small" x="58" y="200">Work items and comments</text><text class="small" x="58" y="227">Projects and workflow states</text><text class="small" x="58" y="254">Development links</text><rect class="box" x="445" y="135" width="305" height="175"/><text class="label" x="463" y="167">git-sync</text><text class="small" x="463" y="200">Verifies signed notifications</text><text class="small" x="463" y="227">Keeps links and write history</text><text class="small" x="463" y="254">Runs rules and Smart Commits</text><rect class="box" x="855" y="135" width="305" height="175"/><text class="label" x="873" y="167">GitHub</text><text class="small" x="873" y="200">Issues and pull requests</text><text class="small" x="873" y="227">Branches and commits</text><text class="small" x="873" y="254">Checks and deployments</text><path class="arrow" d="M345 195 L445 195"/><path class="arrow" d="M445 250 L345 250"/><path class="arrow" d="M750 195 L855 195"/><path class="arrow" d="M855 250 L750 250"/><rect class="box" x="40" y="390" width="710" height="175"/><text class="label" x="58" y="422">Plane Docker network</text><text class="small" x="58" y="455">Plane API → git-sync.internal:3100 (internal webhook)</text><text class="small" x="58" y="482">git-sync → api:8000; plane-db:5432; plane-redis:6379</text><text class="small" x="58" y="509">Own gitsync database; shared Postgres / Valkey services</text><rect class="box" x="855" y="390" width="305" height="175"/><text class="label" x="873" y="422">Public reverse proxy</text><text class="small" x="873" y="455">/git-sync/* → git-sync:3100</text><text class="small" x="873" y="482">GitHub sends HTTPS webhook</text><text class="small" x="873" y="509">Browser uses Plane origin</text><path class="arrow" d="M1005 390 L650 310"/></svg>