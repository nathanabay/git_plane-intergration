<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="635" viewBox="0 0 1200 635" role="img" aria-label="Queues and durable state"><rect width="1200" height="635" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#19334e} .title{font-size:27px;font-weight:bold}.sub{font-size:16px;fill:#49617a}.box{fill:#f0f6ff;stroke:#3676c8;stroke-width:2;rx:12}.label{font-size:19px;font-weight:bold}.small{font-size:16px}.arrow{fill:none;stroke:#3676c8;stroke-width:2.5;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#3676c8"/></marker></defs><text x="40" y="46" class="title">Queues and durable state</text><text x="40" y="78" class="sub">HTTP starts before migrations finish. Workers start after the database is ready.</text><rect class="box" x="40" y="125" width="290" height="205"/><text class="label" x="58" y="157">HTTP ingress / UI</text><text class="small" x="58" y="190">Signed webhook verification</text><text class="small" x="58" y="217">Plane browser authorization</text><text class="small" x="58" y="244">Lightweight /healthz</text><text class="small" x="58" y="271">Plane spool fallback</text><rect class="box" x="435" y="125" width="330" height="205"/><text class="label" x="453" y="157">Valkey / BullMQ</text><text class="small" x="453" y="190">inbound-plane / inbound-github</text><text class="small" x="453" y="217">outbound-plane / outbound-github</text><text class="small" x="453" y="244">maintenance</text><text class="small" x="453" y="271">Prefix: gitsync</text><rect class="box" x="870" y="125" width="290" height="205"/><text class="label" x="888" y="157">Reducers and workers</text><text class="small" x="888" y="190">Scope + reference parsing</text><text class="small" x="888" y="217">Rules and identity resolution</text><text class="small" x="888" y="244">Ordered target execution</text><text class="small" x="888" y="271">Plane / GitHub API clients</text><path class="ar